<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pendant Wall</title>
<meta name="description" content="Five attached pendant frames with left gold heart pinned by its tip, glassy flowing cover, shimmer, parallax hearts (over frames), and looping music with a tiny bottom-right button." />
<style>
  :root{
    /* Sunset palette */
    --sunset-1:#ff9a9e; --sunset-2:#fad0c4; --sunset-3:#fbc2eb; --sunset-4:#a18cd1;

    /* Metals / accent */
    --gold1:#ffe29a; --gold2:#ffbe5f; --gold3:#fff4c9;
    --rose:#ff9cc5;

    /* Glass */
    --glass1:rgba(255,255,255,.28);
    --glass2:rgba(255,255,255,.12);

    --shadow:0 18px 50px rgba(20,8,25,.30);

    /* No vertical gap between rows (they touch) */
    --gap-y: 0;

    /* === Spacing: same on all sides === */
    --pad-x: 14px;       /* left & right */
    --pad-y: 14px;       /* top & bottom (same as sides) */

    /* Heart/chain placement (kept inside viewport for heart) */
    --heart-left: -6px;     /* a little outside the frame but visible on screen */
    --heart-tipY: 50%;
    --chain-left: -28px;    /* chain can peek off the screen slightly */

    /* Music button */
    --music-size: 36px;     /* tiny circle */
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; color:#fff; overflow:hidden; /* one-screen lock */
    background:
      radial-gradient(1200px 600px at 60% 20%, rgba(255,225,200,.35), transparent 60%),
      linear-gradient(135deg, var(--sunset-1), var(--sunset-2) 38%, var(--sunset-3) 68%, var(--sunset-4));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,"Noto Sans","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  }

  /* Subtle film grain */
  .grain{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" /></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.05"/></svg>');
    background-size:180px 180px; mix-blend-mode:soft-light;
  }

  /* Floating hearts (now over frames too) */
  .hearts{
    position:fixed; inset:0; z-index:7; pointer-events:none; overflow:hidden;
    transform: translate3d(0,0,0);
    transition: transform .08s linear;
  }
  .heart{
    position:absolute; font-size:12px; opacity:.9;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));
    animation:floatUp linear forwards;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) scale(.9); opacity:0; }
    6%{ opacity:.9; }
    100%{ transform:translateY(-110vh) translateX(var(--drift,0)) scale(1.05); opacity:0; }
  }

  /* 5 attached rows with equal margins all around */
  .screen{
    position:relative; z-index:2;
    height:100dvh; width:100vw;
    padding: var(--pad-y) var(--pad-x);
    display:grid;
    grid-template-rows: repeat(5, 1fr);
    gap: var(--gap-y);
  }

  /* Frame (no radius -> rows attach seamlessly) */
  .pendant{
    position:relative; width:100%; height:100%;
    border-radius:0;
    background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.08));
    box-shadow:var(--shadow);
    overflow:visible; /* show left heart/chain outside */
    isolation:isolate;
  }

  /* Bezel */
  .pendant::before{
    content:""; position:absolute; inset:0; border-radius:0; padding:2px;
    background:linear-gradient(135deg, var(--gold1), var(--gold2));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite: exclude;
    z-index:8; pointer-events:none;
  }

  /* Photo */
  .photo{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter: contrast(1.05) saturate(1.12) sepia(.05) hue-rotate(-6deg) brightness(1.03);
    z-index:1;
  }

  /* ===== STRONGER GLASS "MIRROR FLOW" (still subtle on the image) ===== */
  .glass{
    position:absolute; inset:0; z-index:3; pointer-events:none;
    /* Base reflections + very light refraction */
    background:
      radial-gradient(130% 80% at -20% -15%, rgba(255,255,255,.22), rgba(255,255,255,0) 55%),
      linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
    mix-blend-mode: screen;
    backdrop-filter: blur(1.2px) saturate(1.08) brightness(1.04);
    -webkit-backdrop-filter: blur(1.2px) saturate(1.08) brightness(1.04);
  }
  /* Flowing specular streaks (diagonal) */
  .glass::before{
    content:""; position:absolute; inset:-8% -16%;
    background:
      linear-gradient(100deg, rgba(255,255,255,.0) 0%,
        rgba(255,255,255,.18) 10%,
        rgba(255,245,210,.30) 14%,
        rgba(255,255,255,.12) 18%,
        rgba(255,255,255,.0) 28%),
      linear-gradient(100deg, rgba(255,255,255,.0) 0%,
        rgba(255,255,255,.12) 58%,
        rgba(255,245,210,.18) 62%,
        rgba(255,255,255,.10) 66%,
        rgba(255,255,255,.0) 76%);
    background-size: 220% 100%, 170% 100%;
    background-position: -40% 0, 110% 0;
    mix-blend-mode: screen;
    animation: streaks 8.4s ease-in-out infinite;
    pointer-events:none;
    opacity:.65;
  }
  @keyframes streaks{
    0%   { background-position: -40% 0, 110% 0; }
    35%  { background-position:  60% 0, -30% 0; }
    70%  { background-position: 140% 0,  60% 0; }
    100% { background-position: 220% 0, -40% 0; }
  }
  /* Soft rotating ripples (caustic feel) */
  .glass::after{
    content:""; position:absolute; inset:-4% -4%;
    background:
      radial-gradient(40% 25% at 20% 10%, rgba(255,255,255,.10), rgba(255,255,255,0) 70%),
      repeating-conic-gradient(from 0deg, rgba(255,255,255,.06) 0 12deg, rgba(255,255,255,0) 12deg 24deg);
    filter: blur(2.2px);
    mix-blend-mode: screen;
    animation: ripples 15s linear infinite;
    pointer-events:none;
    opacity:.18;
  }
  @keyframes ripples{
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Shimmer sweep (kept subtle) */
  .shimmer{
    position:absolute; inset:-10% -20%;
    background:
      linear-gradient(75deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,.12) 45%,
        rgba(255,245,200,.26) 50%,
        rgba(255,255,255,.10) 55%,
        rgba(255,255,255,0) 100%);
    mix-blend-mode: screen;
    filter: blur(0.2px) saturate(1.2);
    z-index:4; pointer-events:none;
    transform: translateX(-120%) rotate(8deg);
    animation: sweep 7.8s ease-in-out infinite;
  }
  @keyframes sweep{
    0%   { transform: translateX(-120%) rotate(8deg); opacity:.0; }
    8%   { opacity:.7; }
    18%  { opacity:.35; }
    40%  { opacity:.0; }
    60%  { opacity:.0; }
    100% { transform: translateX(120%) rotate(8deg); opacity:.0; }
  }

  /* Depth glow near bottom */
  .glow{
    position:absolute; left:0; right:0; bottom:0; height:38%;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,.16), rgba(0,0,0,.26));
    z-index:5; pointer-events:none;
  }

  /* ===== Left-side GOLD HEART pinned by its TIP + pink-gold chain ===== */
  .heart-pin{
    position:absolute;
    top: var(--heart-tipY);
    left: 0;
    transform: translate(var(--heart-left), -50%);
    width: 22px; height: 26px;
    z-index:9; pointer-events:none;
  }
  .heart-pin .tip{
    position:absolute; left:-1px; top:50%; transform: translate(-50%,-50%) rotate(45deg);
    width:10px; height:10px;
    background: radial-gradient(circle at 45% 45%, var(--gold3), var(--gold1) 55%, var(--gold2) 100%);
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  .heart-pin .heart{
    position:absolute; left:-2px; top: calc(50% - 10px);
    width:18px; height:16px; transform: rotate(0deg);
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.3));
  }
  .heart-pin .heart::before,
  .heart-pin .heart::after{
    content:""; position:absolute; width:10px; height:10px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, var(--gold3), var(--gold1) 55%, var(--gold2) 100%);
    top:0;
  }
  .heart-pin .heart::before{ left:0; }
  .heart-pin .heart::after{ right:0; }
  .heart-pin .heart i{
    position:absolute; left:50%; top:4px; transform:translateX(-50%) rotate(45deg);
    width:10px; height:10px;
    background: radial-gradient(circle at 40% 40%, var(--gold3), var(--gold1) 55%, var(--gold2) 100%);
  }
  .heart-pin .chain{
    position:absolute; left: var(--chain-left); top:50%; transform: translateY(-50%) rotate(-18deg);
    width:10px; height:90px;
  }
  .heart-pin .chain::before{
    content:""; position:absolute; left:0; top:0; width:10px; height:10px; border-radius:50%;
    background: radial-gradient(circle at 45% 45%, #ffe9f0, var(--rose) 55%, #ffb46b 100%);
    box-shadow:
      -16px  0   0 0 rgba(255,183,205,1),
      -32px  0   0 0 rgba(255,183,205,1),
      -48px  0   0 0 rgba(255,183,205,1),
      -64px  0   0 0 rgba(255,183,205,1);
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.25));
  }

  /* ===== Tiny Play/Pause button — bottom-right ===== */
  .music{
    position:fixed;
    right: max(8px, env(safe-area-inset-right, 8px));
    bottom: max(8px, env(safe-area-inset-bottom, 8px));
    width: var(--music-size); height: var(--music-size);
    z-index:10; pointer-events:auto;
  }
  .music button{
    width: 100%; height: 100%;
    appearance:none; border:1px solid rgba(255,255,255,.55);
    background: linear-gradient(180deg, var(--glass1), var(--glass2));
    backdrop-filter: blur(10px) saturate(120%); -webkit-backdrop-filter: blur(10px) saturate(120%);
    border-radius: 999px;
    color:#fff; font-size: 14px; font-weight:900; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(0,0,0,.28);
    cursor:pointer;
  }

  @media (max-width:430px){
    :root{ --music-size: 34px; }
  }
</style>
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<!-- Hearts now float OVER the frames too -->
<div class="hearts" aria-hidden="true"></div>

<section class="screen" id="screen"></section>

<!-- Tiny bottom-right music button -->
<div class="music" id="music">
  <button id="musicBtn" type="button" aria-label="Play/Pause">▶</button>
</div>

<!-- Looping background music -->
<audio id="bgm" preload="auto" playsinline loop crossOrigin="anonymous" style="display:none"></audio>

<script>
/* -------------------- CONFIG -------------------- */
const ASSET_BASE = '';
// For GitHub RAW, e.g.:
// const ASSET_BASE = 'https://raw.githubusercontent.com/<user>/<repo>/<branch>/path/';

const IMAGES = ['Image_1.jpg','Image_2.jpg','Image_3.jpg','Image_4.jpg','Image_5.jpg'];
const SONG   = 'song.mp3';

/* -------------------- BUILD GRID -------------------- */
const screenEl = document.getElementById('screen');

IMAGES.forEach((file, idx) => {
  const card = document.createElement('article');
  card.className = 'pendant';

  const img = document.createElement('img');
  img.className = 'photo';
  img.alt = 'Photo';
  img.loading = 'eager'; img.decoding = 'async';
  img.src = ASSET_BASE + file;

  /* Glassy mirror flow + shimmer + depth glow */
  const glass = document.createElement('div'); glass.className = 'glass';
  const shimmer = document.createElement('div'); shimmer.className = 'shimmer';
  shimmer.style.animationDelay = (idx * 1.2) + 's';
  const glow = document.createElement('div'); glow.className = 'glow';

  /* Left gold heart pinned by its tip + short chain */
  const pin = document.createElement('div'); pin.className = 'heart-pin';
  const tip = document.createElement('div'); tip.className = 'tip';
  const heart = document.createElement('div'); heart.className = 'heart';
  const heartDiamond = document.createElement('i'); heart.appendChild(heartDiamond);
  const chain= document.createElement('div'); chain.className = 'chain';
  pin.appendChild(tip); pin.appendChild(heart); pin.appendChild(chain);

  card.appendChild(img);
  card.appendChild(glass);
  card.appendChild(shimmer);
  card.appendChild(glow);
  card.appendChild(pin);

  screenEl.appendChild(card);
});

/* ----------------- FLOATING HEARTS (over frames) + PARALLAX ------------------ */
const heartsLayer = document.querySelector('.hearts');
const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function spawnHeart(){
  const h = document.createElement('div');
  h.className = 'heart';
  h.textContent = Math.random() < 0.65 ? '💗' : '💖';
  const startX = Math.random() * innerWidth;
  const size   = 10 + Math.random()*8;
  const dur    = 7 + Math.random()*6;
  const drift  = (Math.random()*70 - 35) + 'px';
  h.style.left = Math.max(4, Math.min(innerWidth - 24, startX)) + 'px';
  h.style.bottom = '-22px';
  h.style.fontSize = size + 'px';
  h.style.setProperty('--drift', drift);
  h.style.animationDuration = dur + 's';
  heartsLayer.appendChild(h);
  setTimeout(()=> h.remove(), dur*1000);
}
let heartTimer = null;
function startHearts(){
  if (heartTimer) return;
  const rate = prefersReduced ? 650 : 420;
  for (let i=0;i<10;i++) setTimeout(spawnHeart, i*180);
  heartTimer = setInterval(spawnHeart, rate);
}
startHearts();

// Parallax layer shift (pointer / device tilt)
(function(){
  let tx = 0, ty = 0;
  function apply(){
    const px = Math.max(-6, Math.min(6, tx));
    const py = Math.max(-6, Math.min(6, ty));
    heartsLayer.style.transform = `translate3d(${px}px, ${py}px, 0)`;
    requestAnimationFrame(apply);
  }
  requestAnimationFrame(apply);

  window.addEventListener('pointermove', (e)=>{
    const cx = innerWidth/2, cy = innerHeight/2;
    const nx = (e.clientX - cx) / cx;
    const ny = (e.clientY - cy) / cy;
    tx = nx * 6; ty = ny * 6;
  }, {passive:true});

  window.addEventListener('deviceorientation', (e)=>{
    if (typeof e.gamma !== 'number' || typeof e.beta !== 'number') return;
    const nx = (e.gamma || 0) / 30;
    const ny = (e.beta  || 0) / 30;
    tx = nx * 6; ty = ny * 6;
  }, {passive:true});
})();

/* ------------------ LOOPING AUTOPLAY MUSIC + tiny control ------------------ */
const audio = document.getElementById('bgm');
audio.src = ASSET_BASE + SONG;
audio.volume = 0.0;   // fade in smoothly
audio.loop = true;    // loop again when it ends (attribute + JS set)

/* Fallback: if loop is ignored by some engines */
audio.addEventListener('ended', ()=>{
  try{ audio.currentTime = 0; audio.play(); }catch(e){}
});

const btn   = document.getElementById('musicBtn');

let fading = false;
function fadeTo(target, ms=900){
  if (fading) return;
  fading = true;
  const start = performance.now();
  const from = audio.volume;
  function step(t){
    const k = Math.min(1, (t-start)/ms);
    audio.volume = from + (target - from) * k;
    if (k < 1) requestAnimationFrame(step);
    else { audio.volume = target; fading = false; }
  }
  requestAnimationFrame(step);
}

async function attemptAutoplay(){
  try{
    await audio.play();            // try autoplay
    fadeTo(1.0, 900);
    btn.textContent = '⏸';
  }catch(e){
    btn.textContent = '▶';         // needs a tap, button is already visible
  }
}

btn.addEventListener('click', async ()=>{
  try{
    if (audio.paused){
      await audio.play();
      fadeTo(1.0, 600);
      btn.textContent = '⏸';
    }else{
      fadeTo(0.0, 400);
      setTimeout(()=>{ try{ audio.pause(); }catch(e){} }, 420);
      btn.textContent = '▶';
    }
  }catch(e){}
});

if (document.readyState === 'complete' || document.readyState === 'interactive'){
  attemptAutoplay();
} else {
  document.addEventListener('DOMContentLoaded', attemptAutoplay);
}

/* Keep page locked to one screen */
window.addEventListener('touchmove', (e)=>{ e.preventDefault(); }, {passive:false});
</script>
</body>
</html>
