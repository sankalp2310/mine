<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pendant Wall</title>
<meta name="description" content="Five attached pendant frames with a tilted gold heart on the boundary, calm single-flow glass effect, floating hearts, and looping music with a tiny bottom-right button. Portrait shows a rotate prompt." />
<style>
  :root{
    /* Sunset palette */
    --sunset-1:#ff9a9e; --sunset-2:#fad0c4; --sunset-3:#fbc2eb; --sunset-4:#a18cd1;

    /* Metals */
    --gold1:#ffe29a; --gold2:#ffbe5f; --gold3:#fff4c9;

    /* Glass */
    --glass1:rgba(255,255,255,.28);
    --glass2:rgba(255,255,255,.12);

    --shadow:0 18px 50px rgba(20,8,25,.30);

    /* No vertical gap between rows (they touch) */
    --gap-y: 0;

    /* Uniform margins (same on all sides) */
    --pad-x: 18px;
    --pad-y: var(--pad-x);

    /* Heart placement (tilted, pinned on boundary) */
    --heart-tipY: 50%;
    --heart-nudge-x: -1px;

    /* Tiny Play/Pause button */
    --music-size: 32px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; color:#fff; overflow:hidden; /* one-screen lock */
    background:
      radial-gradient(1200px 600px at 60% 20%, rgba(255,225,200,.35), transparent 60%),
      linear-gradient(135deg, var(--sunset-1), var(--sunset-2) 38%, var(--sunset-3) 68%, var(--sunset-4));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,"Noto Sans","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  }

  /* Subtle film grain */
  .grain{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" /></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.05"/></svg>');
    background-size:180px 180px; mix-blend-mode:soft-light;
  }

  /* Floating hearts (over frames) */
  .hearts{
    position:fixed; inset:0; z-index:12; pointer-events:none; overflow:hidden;
    transform: translate3d(0,0,0);
    transition: transform .08s linear;
  }
  .heart{
    position:absolute; font-size:12px; opacity:.9;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));
    animation:floatUp linear forwards;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) scale(.9); opacity:0; }
    6%{ opacity:.9; }
    100%{ transform:translateY(-110vh) translateX(var(--drift,0)) scale(1.05); opacity:0; }
  }

  /* 5 attached rows with equal margins all around */
  .screen{
    position:relative; z-index:2;
    height:100dvh; width:100vw;
    padding: var(--pad-y) var(--pad-x);
    display:grid;
    grid-template-rows: repeat(5, 1fr);
    gap: var(--gap-y);
  }

  /* Frame */
  .pendant{
    position:relative; width:100%; height:100%;
    border-radius:0;
    background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.08));
    box-shadow:var(--shadow);
    overflow:visible; /* show the heart peeking outside the edge */
    isolation:isolate;
    z-index:5;
  }

  /* Bezel */
  .pendant::before{
    content:""; position:absolute; inset:0; border-radius:0; padding:2px;
    background:linear-gradient(135deg, var(--gold1), var(--gold2));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite: exclude;
    z-index:7; pointer-events:none;
  }

  /* Photo */
  .photo{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter: contrast(1.05) saturate(1.12) sepia(.05) hue-rotate(-6deg) brightness(1.03);
    z-index:1;
  }

  /* Calm glass water flow (single pattern) */
  .glass{
    position:absolute; inset:0; z-index:6; pointer-events:none;
    background:
      radial-gradient(130% 80% at -20% -15%, rgba(255,255,255,.18), rgba(255,255,255,0) 55%),
      linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
    mix-blend-mode: screen;
    backdrop-filter: blur(1px) saturate(1.05) brightness(1.03);
    -webkit-backdrop-filter: blur(1px) saturate(1.05) brightness(1.03);
  }
  .glass::before{
    content:""; position:absolute; inset:-10% -22%;
    background:
      linear-gradient(100deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,.18) 10%,
        rgba(255,245,210,.26) 14%,
        rgba(255,255,255,.12) 18%,
        rgba(255,255,255,0) 28%);
    background-size: 220% 100%;
    background-position: -40% 0;
    mix-blend-mode: screen;
    animation: calmFlow 16s ease-in-out infinite;
    opacity:.55;
  }
  @keyframes calmFlow{
    0%   { background-position: -40% 0; }
    50%  { background-position:  80% 0; }
    100% { background-position: 220% 0; }
  }

  /* Depth glow near bottom */
  .glow{
    position:absolute; left:0; right:0; bottom:0; height:38%;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,.16), rgba(0,0,0,.26));
    z-index:6; pointer-events:none;
  }

  /* Left GOLD HEART (SVG, tilted) pinned on boundary */
  .heart-pin{
    position:absolute;
    top: var(--heart-tipY);
    left: 0;                 /* attach to the left frame edge */
    transform: translate(var(--heart-nudge-x), -50%);
    z-index:10;              /* above glass/bezel */
    pointer-events:none;
  }
  .gold-heart{
    position:absolute;
    left: 0; top: 50%;
    width: 22px; height: 20px;
    transform-box: fill-box;
    transform-origin: 50% 90%;
    transform: translate(-10px, -18px) rotate(-12deg); /* slight tilt */
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.3));
  }

  /* Tiny Play/Pause button — bottom-right */
  .music{
    position:fixed;
    right: max(8px, env(safe-area-inset-right, 8px));
    bottom: max(8px, env(safe-area-inset-bottom, 8px));
    width: var(--music-size); height: var(--music-size);
    z-index:30; pointer-events:auto;
  }
  .music button{
    width: 100%; height: 100%;
    appearance:none; border:1px solid rgba(255,255,255,.55);
    background: linear-gradient(180deg, var(--glass1), var(--glass2));
    backdrop-filter: blur(10px) saturate(120%); -webkit-backdrop-filter: blur(10px) saturate(120%);
    border-radius: 999px;
    color:#fff; font-size: 13px; font-weight:900; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(0,0,0,.28);
    cursor:pointer;
  }

  @media (max-width:430px){
    :root{ --music-size: 30px; }
  }

  /* Portrait: show rotate prompt; hide gallery to avoid cropping */
  .rotate-overlay{
    position:fixed; inset:0; z-index:40; display:none;
    align-items:center; justify-content:center; flex-direction:column;
    gap:12px; color:#fff;
    background: linear-gradient(135deg, rgba(0,0,0,.35), rgba(0,0,0,.25));
    text-align:center; padding: 24px;
    font-weight:800; letter-spacing:.3px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .rotate-overlay .icon{
    font-size: 36px; line-height:1; opacity:.9;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.4));
  }
  .rotate-overlay .hint{
    font-size: 14px; opacity:.95;
  }
  @media (orientation: portrait){
    .rotate-overlay{ display:flex; }
    .screen{ display:none; }
    .hearts{ display:none; }
    .music{ display:none; }
  }
</style>
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<!-- Hearts float over frames -->
<div class="hearts" aria-hidden="true"></div>

<!-- 5 attached pendants -->
<section class="screen" id="screen"></section>

<!-- Tiny bottom-right music button -->
<div class="music" id="music">
  <button id="musicBtn" type="button" aria-label="Play/Pause">▶</button>
</div>

<!-- Rotate prompt in portrait -->
<div class="rotate-overlay" id="rotate">
  <div class="icon">🔁📱</div>
  <div class="hint">Meera, phone ghuma landscape mode m 🫠</div>
</div>

<!-- Looping background music -->
<audio id="bgm" preload="auto" playsinline loop autoplay crossOrigin="anonymous" style="display:none"></audio>

<script>
/* -------------------- CONFIG -------------------- */
const ASSET_BASE = '';
// If you use an assets folder, set: const ASSET_BASE = 'assets/';

const IMAGES = ['Image_1.jpg','Image_2.jpg','Image_3.jpg','Image_4.jpg','Image_5.jpg'];
const SONG   = 'song.mp3';

/* -------------------- BUILD GRID -------------------- */
const screenEl = document.getElementById('screen');

IMAGES.forEach((file) => {
  const card = document.createElement('article');
  card.className = 'pendant';

  const img = document.createElement('img');
  img.className = 'photo';
  img.alt = 'Photo';
  img.loading = 'eager'; img.decoding = 'async';
  img.src = ASSET_BASE + file;

  /* Calm glass flow + depth glow (no shimmer) */
  const glass = document.createElement('div'); glass.className = 'glass';
  const glow  = document.createElement('div'); glow.className  = 'glow';

  /* Gold heart (SVG, tilted) pinned on boundary */
  const pin = document.createElement('div'); pin.className = 'heart-pin';
  pin.insertAdjacentHTML('beforeend', `
    <svg class="gold-heart" viewBox="0 0 20 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"  stop-color="#fff4c9"/>
          <stop offset="55%" stop-color="#ffe29a"/>
          <stop offset="100%" stop-color="#ffbe5f"/>
        </linearGradient>
      </defs>
      <path d="M10 18
               L1.5 9.5
               A4.5 4.5 0 1 1 8 3.5
               L10 5.7
               L12 3.5
               A4.5 4.5 0 1 1 18.5 9.5
               Z"
            fill="url(#gGold)"/>
    </svg>
  `);

  card.appendChild(img);
  card.appendChild(glass);
  card.appendChild(glow);
  card.appendChild(pin);

  screenEl.appendChild(card);
});

/* ----------------- FLOATING HEARTS (over frames) + PARALLAX ------------------ */
const heartsLayer = document.querySelector('.hearts');
const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function spawnHeart(){
  const h = document.createElement('div');
  h.className = 'heart';
  h.textContent = Math.random() < 0.65 ? '💗' : '💖';
  const startX = Math.random() * innerWidth;
  const size   = 10 + Math.random()*8;
  const dur    = 7 + Math.random()*6;
  const drift  = (Math.random()*70 - 35) + 'px';
  h.style.left = Math.max(4, Math.min(innerWidth - 24, startX)) + 'px';
  h.style.bottom = '-22px';
  h.style.fontSize = size + 'px';
  h.style.setProperty('--drift', drift);
  h.style.animationDuration = dur + 's';
  heartsLayer.appendChild(h);
  setTimeout(()=> h.remove(), dur*1000);
}
let heartTimer = null;
function startHearts(){
  if (heartTimer) return;
  const rate = prefersReduced ? 650 : 420;
  for (let i=0;i<10;i++) setTimeout(spawnHeart, i*180);
  heartTimer = setInterval(spawnHeart, rate);
}
startHearts();

// Parallax layer shift (pointer / device tilt)
(function(){
  let tx = 0, ty = 0;
  function apply(){
    const px = Math.max(-6, Math.min(6, tx));
    const py = Math.max(-6, Math.min(6, ty));
    heartsLayer.style.transform = `translate3d(${px}px, ${py}px, 0)`;
    requestAnimationFrame(apply);
  }
  requestAnimationFrame(apply);

  window.addEventListener('pointermove', (e)=>{
    const cx = innerWidth/2, cy = innerHeight/2;
    const nx = (e.clientX - cx) / cx;
    const ny = (e.clientY - cy) / cy;
    tx = nx * 6; ty = ny * 6;
  }, {passive:true});

  window.addEventListener('deviceorientation', (e)=>{
    if (typeof e.gamma !== 'number' || typeof e.beta !== 'number') return;
    const nx = (e.gamma || 0) / 30;
    const ny = (e.beta  || 0) / 30;
    tx = nx * 6; ty = ny * 6;
  }, {passive:true});
})();

/* ------------------ LOOPING AUTOPLAY MUSIC + button-only pause ------------------ */
const audio = document.getElementById('bgm');
audio.src = ASSET_BASE + SONG;
audio.loop = true;
audio.volume = 0.0;   // start low; fade up on success

const btn = document.getElementById('musicBtn');
let userPaused = false;  // only the button sets this to true

function fadeTo(target, ms=900){
  const start = performance.now();
  const from = audio.volume;
  function step(t){
    const k = Math.min(1, (t-start)/ms);
    audio.volume = from + (target - from) * k;
    if (k < 1) requestAnimationFrame(step);
    else audio.volume = target;
  }
  requestAnimationFrame(step);
}

/* Aggressive autoplay attempts on load/refresh */
async function tryPlay(tag){
  try{
    await audio.play();
    fadeTo(1.0, 900);
    btn.textContent = '⏸';
    return true;
  }catch(e){
    return false;
  }
}

async function attemptAutoplay(){
  // Try immediately
  if (await tryPlay('immediate')) return;

  // Retry a few times quickly (helps when audio buffer finishes loading just after DOM)
  let tries = 0;
  const maxTries = 5;
  const timer = setInterval(async ()=>{
    if (await tryPlay('retry-'+tries)) { clearInterval(timer); }
    if (++tries >= maxTries) clearInterval(timer);
  }, 450);

  // As a safety net, also try when the tab becomes visible or the page is shown
  const vis = async ()=>{ if (!userPaused && audio.paused) await tryPlay('visibility'); };
  document.addEventListener('visibilitychange', vis);
  window.addEventListener('pageshow', vis, { once:false });
  window.addEventListener('focus', vis);

  // And on the first user gesture, try to start (only start; we never pause on gestures)
  const onceStart = async ()=>{
    if (!userPaused && audio.paused) await tryPlay('gesture');
    window.removeEventListener('pointerdown', onceStart);
    window.removeEventListener('touchstart', onceStart);
    window.removeEventListener('keydown', onceStart);
  };
  window.addEventListener('pointerdown', onceStart, { passive:true });
  window.addEventListener('touchstart',  onceStart, { passive:true });
  window.addEventListener('keydown',     onceStart);
}

/* Only the tiny button toggles playback */
btn.addEventListener('click', async ()=>{
  try{
    if (audio.paused){
      userPaused = false;
      await audio.play();
      fadeTo(1.0, 600);
      btn.textContent = '⏸';
    }else{
      userPaused = true;
      fadeTo(0.0, 350);
      setTimeout(()=>{ try{ audio.pause(); }catch(e){} }, 360);
      btn.textContent = '▶';
    }
  }catch(e){}
});

/* Fallback loop in case some engines ignore the loop attribute */
audio.addEventListener('ended', async ()=>{
  if (!userPaused){
    try{ audio.currentTime = 0; await audio.play(); }catch(e){}
  }
});

/* Run autoplay attempt as soon as possible */
if (document.readyState === 'complete' || document.readyState === 'interactive'){
  attemptAutoplay();
} else {
  document.addEventListener('DOMContentLoaded', attemptAutoplay);
}

/* Keep the page to a single screen (no scroll) */
window.addEventListener('touchmove', (e)=>{ e.preventDefault(); }, {passive:false});
</script>
</body>
</html>
